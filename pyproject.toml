[project]
name = "vaultscope"
version = "0.1.0"
description = "AI-Powered IPsec VPN Protocol Analyzer & Security Assessment Framework (SIH 2026, SIH26160, NTRO)"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
# Run the whole suite from the repo root with:  pytest
# pythonpath = ["."] lets tests do `import core.ike_parser` etc. with no install step.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: test that needs the full generated dataset or a trained model",
    "integration: crosses slice boundaries (needs another engineer's component)",
]

[tool.coverage.run]
source = ["core", "reporting", "api"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]
