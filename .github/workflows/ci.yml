name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System dependencies (dumpcap, pango for WeasyPrint)
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tshark libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      # Labels match the schema and every one has a published, hashed capture.
      - run: python scripts/validate_dataset.py
      # The testbed suite drives real strongSwan containers and the dataset suite
      # reads the 129 MB capture corpus; both run locally, not on every push.
      - run: pytest -m "not slow" --ignore=tests/testbed --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Console · lint + types + vitest + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npx eslint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end · Cypress against the real stack
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt
      - name: Start the backend
        run: |
          VAULTSCOPE_DB=$RUNNER_TEMP/e2e.sqlite VAULTSCOPE_CAPTURE_DIR=$RUNNER_TEMP/captures \
            nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > $RUNNER_TEMP/api.log 2>&1 &
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npx --yes serve@14 out -l 3000
          wait-on: "http://localhost:3000, http://127.0.0.1:8000/health"
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          CYPRESS_apiBase: http://127.0.0.1:8000
      - if: failure()
        run: cat $RUNNER_TEMP/api.log
