# `Connection: upgrade` only when the client asked for it; a plain request
# must not be handed an upgrade header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Static export writes /sessions.html, not /sessions/index.html.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # The console calls the backend same-origin under /api, so nothing has to
    # know the backend's address and there is no CORS preflight on any request.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /api/ws/live is a WebSocket; without these it is a failed handshake.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;

        # Captures are uploaded whole.
        client_max_body_size 512m;
    }
}
